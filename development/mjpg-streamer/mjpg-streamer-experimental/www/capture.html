    <script>
      function changeImage()
      {
      element=document.getElementById('streamimage')
      if (element.src.match("stream"))
      {
      element.src="./?action=capture";
      }
      else
      {
        element.src="./?action=stream";
      }
      }

      var xhr = new XMLHttpRequest();
      function submitform()
      {
      <!-- alert("Sending Json"); -->
      xhr.open("POST", "/getdepth", true);
      xhr.setRequestHeader('Content-Type', 'application/json; charset=UTF-8');
      var xcoorder = document.getElementById("xcoorder").value;
      var ycoorder = document.getElementById("ycoorder").value;

      var value = {"xcoorder":xcoorder, "ycoorder":ycoorder};
      var tmp = JSON.stringify(value);
      alert(tmp);

      xhr.send(JSON.stringify(value));
      <!-- xhr.addEventListener("readystatechange", processRequest, false); -->
      xhr.onreadystatechange = processRequest;
      }

      function processRequest(e) {
      if (xhr.readyState == 4 && xhr.status == 200)
      {
      <!-- alert(xhr.responseText);       -->
      <!-- var response = JSON.parse(xhr.responseText); -->
      var obj = JSON.parse(xhr.responseText);
      var html = "<p> x = " + obj.x + "</p>" + "<p> y = " + obj.y + "</p>";

      document.getElementById("out").innerHTML=html
      }
      }
    </script>

    <div id="content">
    <p id="streamwrap" class="xform-p">
      <img class="xform" id="streamimage" onclick="changeImage()" src="./?action=capture" />
    </p>


    <!-- <form action="/getdepth" method="post" enctype="application/json" name="cooderform"> -->

    <form action="/getdepth" method="post" name="cooderform" enctype="application/json">
      <p>
	<label for="x">
	  X: <input id="xcoorder" name="xcoorder" value="0"/>
	</label>
      </p>
      <p>
	<label for="y">
	  y: <input id="ycoorder" name="ycoorder" value="0"/>
	</label>
      </p>
      <button type="button" onclick="submitform()"> submit </button>
      <!-- <button type="submit"> submit </button> -->
    </form>
    <br>
    <div id="out">
