pcm.!default
{
   type asym
    playback.pcm "play_chn0"
    capture.pcm "cap_chn0"
}

pcm.play_chn0 {
	type plug
	slave {
		pcm dmixer
	}
}

pcm.play_chn1 {
	type plug
	slave {
		pcm dmixer
	}
}

pcm.cap_chn0 {
    type plug
    slave {
        pcm dsnooper
    }
}

pcm.tloop_cap {
    type plug
    slave {
        pcm dsnooper_tloop
    }
}

pcm.cap_dmic {
    type plug
    slave {
        pcm "hw:0,1"
    	channels 2
	rate 16000
    }
}

pcm.dmixer  {
    type dmix
    ipc_key 772357
    ipc_key_add_uid yes
    slave {
	    pcm "hw:0,0"
	    period_time 0
	    period_size 320
	    buffer_size 2560
	    rate 16000
	}
}

pcm.dsnooper {
    type dsnoop
    ipc_key 772358
    ipc_key_add_uid yes
    slave {
        pcm "hw:0,0"
	period_time 0
        channels 2
	period_size 320
	buffer_size 2560
        rate 16000
    }
    bindings {
     0 0
     1 1
    }
}

pcm.dsnooper_tloop {
    type dsnoop
    ipc_key 772350
    ipc_key_add_uid yes
    slave {
        pcm "hw:0,2"
	period_time 0
        channels 1
	period_size 320
	buffer_size 2560
        rate 16000
    }
    bindings {
     0 0
    }
}

ctl.dmixer {
     type hw
     card 0
}

ctl.dsnooper {
     type hw
     card 0
}

ctl.dsnooper_tloop {
     type hw
     card 0
}

