pcm.!default
{
   type asym
    playback.pcm "play_chn0"
    capture.pcm "cap_chn0"
}

pcm.play_chn0 {
	type plug
	slave {
		pcm dmixer
	}
}

pcm.play_chn1 {
	type plug
	slave {
		pcm dmixer
	}
}

pcm.cap_chn0 {
    type plug
    slave {
        pcm dsnooper
    }
}

pcm.cap_dmic {
    type plug
    slave {
        pcm "hw:0,5"
    	channels 2
	rate 16000
    }
}

pcm.dmixer  {
    type dmix
    ipc_key 772357
    ipc_key_add_uid yes
    slave {
	    pcm "hw:0,0"
	    period_time 0
	    period_size 320
	    buffer_size 2560
	    rate 16000
	}
}

pcm.dsnooper {
    type dsnoop
    ipc_key 772358
    ipc_key_add_uid yes
    slave {
        pcm "hw:0,6"
	period_time 0
        channels 2
	period_size 320
	buffer_size 2560
        rate 16000
    }
    bindings {
     0 0
     1 1
    }
}


ctl.dmixer {
     type hw
     card 0
}

ctl.dsnooper {
     type hw
     card 0
}

pcm.multi {
 type route;
 slave.channels 2;
 slave.format S16_LE;
 slave.pcm {
         type multi;
         slaves.a.pcm "output";
         slaves.b.pcm "loopin";
         slaves.a.channels 1;
         slaves.b.channels 1;
         bindings.0.slave a;
         bindings.0.channel 0;
         bindings.1.slave b;
         bindings.1.channel 0;
       }

   ttable.0.0 1;
   ttable.0.1 1;
}

pcm.output {
	type hw
        card 0
	device 0
	subdevice 0
}

pcm.loopin {
	type plug
	slave.pcm "hw:Loopback,1,0"
}

pcm.tloop_cap {
	type plug
	slave.pcm "hw:Loopback,0,0"
}

