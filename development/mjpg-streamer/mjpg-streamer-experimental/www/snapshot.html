  <body>
    <div id="sidebar">
      <h1>MJPG-Streamer Demo Pages</h1>
      <h2>a resource-friendly streaming application</h2>

      <div id="menu">
        <a href="index.html">Home</a>

        <a href="calibrate.html">Calibrate</a>
        <a href="setting.html">SetSgbm</a>

        <a class="active" href="snapshot.html">Snapshot</a>
      </div>

      <h3>Version info:</h3>
      <p>v0.1 (Okt 22, 2007)</p>
    </div>

	<div id="content">
		<h1>Snapshot</h1>
		<h2>download snapshot image</h2>
		<p class="xform-p"></p>
		<div>
			<button type=button id="bsnapshot">SnapShot</button>
		</div>

		<p class="xform-p"></p>
		<p id="streamwrap" class="xform-p">
		<img id="stream" width=320 height=240  src="./?action=stream"/>
		<img id="static"  hidden width =320 height =240 src="./?action=snapshot"  />
		<canvas id="myCanvas" width="320" height="240" />
		</p>
	</div>

	<script type="text/javascript">
	  var num = 0;
	  var canvasElem = document.getElementById("myCanvas");
	  var ctx = canvasElem.getContext("2d");

	  document.getElementById("bsnapshot").onclick = handleSnapshot;
	  function handleSnapshot() {
	    var imageElement = document.getElementById("stream");
	    ctx.drawImage(imageElement,0,0,320,240);
	    var img = document.getElementById("static");
	    var url = img.src;
	    downloadImage(url);
	  }

	  function downloadImage(url) {
 	    var a = document.createElement('a');
	    var event = new MouseEvent('click');
 
	    a.download = "calib-" + num + ".jpeg";
	    a.href = url;
	    a.dispatchEvent(event);
	    num ++ ;
	  }
	</script>

  </body>

</html>
